<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <title>Офлайн — B1 Polish Trainer</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #020617;
        color: #e2e8f0;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(56, 189, 248, 0.18), transparent 28%),
          radial-gradient(circle at bottom left, rgba(124, 58, 237, 0.18), transparent 32%),
          #020617;
      }

      main {
        max-width: 560px;
        border: 1px solid rgba(148, 163, 184, 0.14);
        border-radius: 24px;
        padding: 28px;
        background: rgba(15, 23, 42, 0.9);
        box-shadow: 0 24px 80px rgba(2, 6, 23, 0.45);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.8rem, 4vw, 2.6rem);
      }

      p {
        margin: 0 0 14px;
        color: #cbd5e1;
        line-height: 1.55;
      }

      .note {
        margin-top: 18px;
        padding: 14px 16px;
        border-radius: 16px;
        background: rgba(2, 6, 23, 0.72);
        border: 1px solid rgba(148, 163, 184, 0.12);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Офлайн-режим</h1>
      <p>Сеть недоступна, но это приложение рассчитано на локальную работу и сохранение прогресса в браузере.</p>
      <p>Когда соединение вернется, обновите страницу, чтобы снова открыть полный тренажер.</p>
      <div class="note">B1 Polish Trainer</div>
    </main>
  </body>
</html>
