<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" content="#020617" />
    <meta
      name="description"
      content="Компактный Polish B1 trainer для русскоязычного ученика: 12-дневный интенсив, тренировка, грамматика, чтение, аудирование, письмо, говорение и мини-мок."
    />
    <meta property="og:title" content="B1 Polish Trainer" />
    <meta
      property="og:description"
      content="Локальный PWA-тренажер подготовки к польскому B1 для русскоязычного ученика с 12-дневным интенсивом и мини-моком."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>B1 Polish Trainer</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator && window.location.pathname.startsWith('/b1/')) {
        window.addEventListener(
          'load',
          () => {
            navigator.serviceWorker.register('/b1/sw.js', { scope: '/b1/' }).catch(() => {})
          },
          { once: true },
        )
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
